services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      AUTH_MODE: demo
      REPOSITORY_BACKEND: memory
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_AUTH_MODE: demo
    ports:
      - "5173:80"
    depends_on:
      - backend
